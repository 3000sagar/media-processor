services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set an S3 access key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set an S3 secret key}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID} ${AWS_SECRET_ACCESS_KEY} && mc mb --ignore-existing local/${S3_BUCKET_RAW} && mc mb --ignore-existing local/${S3_BUCKET_PROCESSED}"
    networks: [internal]

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?set a real user, never guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?set a real password}
    # No `ports:` mapping to the host — only api/worker on the internal network can reach
    # this. If you need the management UI for debugging, temporarily add
    # "127.0.0.1:15672:15672" (never 0.0.0.0) and remove it again afterward.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set a real password}", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    env_file: ../.env
    environment:
      # Compose's own ${VAR} substitution (reading .env next to this file) is guaranteed;
      # env_file's literal pass-through of ${VAR} references inside .env is NOT — these
      # three lines exist specifically so RABBITMQ_URL/REDIS_URL/CELERY_RESULT_BACKEND
      # resolve correctly regardless of which mechanism the .env file's own values rely on.
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    ports:
      - "8000:8000"
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [internal]

  worker:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.worker
    env_file: ../.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672//
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/1
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    networks: [internal]
    deploy:
      replicas: 2
      # Cost/DoS control from the audit: autoscaling (or here, manual `--scale`) must have
      # an explicit ceiling. `docker-compose up --scale worker=N` — do not set N unbounded.

networks:
  internal:
    driver: bridge
